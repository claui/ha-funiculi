name: Run CI checks

on:
  - push
  - workflow_call

env:
  CI_UV_VERSION: "0.13.6"

jobs:
  ci-checks:
    runs-on: ubuntu-26.04

    steps:
      - name: Check out source tree
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.CI_UV_VERSION }}

      - name: Run static typechecking
        run: uv run poe typecheck

      - name: Run linter
        run: uv run poe linter

      - name: Check for formatting style violations not covered by the linter
        run: uv run poe formatcheck

      - name: Run unit tests
        run: uv run poe tests

  hassfest:
    runs-on: ubuntu-26.04

    steps:
      - name: Check out source tree
        uses: actions/checkout@v7

      - name: Validate the integration manifest and translations
        uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-26.04

    steps:
      - name: Check out source tree
        uses: actions/checkout@v7

      - name: Validate the repository for the HACS catalog
        uses: hacs/action@main
        with:
          category: integration
