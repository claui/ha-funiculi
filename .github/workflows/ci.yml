name: Run CI checks

on:
  - push
  - workflow_call

env:
  CI_UV_VERSION: "0.13.6"

jobs:
  ci-checks:
    runs-on: ubuntu-26.04

    steps:
      - name: Check out source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.CI_UV_VERSION }}

      - name: Run static typechecking
        run: uv run poe typecheck

      - name: Run linter
        run: uv run poe linter

      - name: Check for formatting style violations not covered by the linter
        run: uv run poe formatcheck

      - name: Run unit tests
        run: uv run poe tests

  hassfest:
    runs-on: ubuntu-26.04

    steps:
      - name: Check out source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Validate the integration manifest and translations
        # home-assistant/actions/hassfest@master, SHA-pinned to match
        # this repository’s action allowlist.
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361

  hacs:
    runs-on: ubuntu-26.04

    steps:
      - name: Check out source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Validate the repository for the HACS catalog
        # hacs/action@main, SHA-pinned to match this repository’s
        # action allowlist.
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
